<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#fafafa;color:#111;font-family:Geist,sans-serif}
.nav{height:64px;background:#111;color:#fafafa;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:14px}
.nav .m{display:flex;gap:28px;opacity:.85}
.nav img{height:34px;filter:grayscale(1) brightness(3)}
.hero{height:560px;margin:24px 40px 0;border-radius:14px;overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;filter:saturate(.6)}
.copy{position:absolute;left:56px;bottom:56px;color:#fff}
.copy h1{font-size:56px;font-weight:500;letter-spacing:-.03em;line-height:1.05;max-width:600px}
.row{display:flex;gap:12px;margin-top:24px}
.b1{background:#c4161c;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px}
.b2{border:1px solid rgba(255,255,255,.6);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:40px}
.pair h2{font-size:32px;font-weight:500;letter-spacing:-.02em}
.pair p{color:#6b6b6b;margin-top:10px;font-size:16px}
.shot{background:radial-gradient(circle at 50% 40%,#fff,#ececec);border-radius:12px;height:200px}
</style></head><body>
<div class="nav"><img src="../../../public/logo.png" alt="Esçay"><div class="m"><span>Siyah Çay</span><span>Yeşil Çay</span><span>Bitki Çayı</span><span>Harmanlar</span><span>Hediye</span></div><span>Sepet 0</span></div>
<div class="hero"><img src="../../../public/fabrika/fabrika-bahceler.jpg" alt=""><div class="copy"><h1>Bahçeden bardağa, tek fabrikadan.</h1><div class="row"><span class="b1">Siyah çaylar</span><span class="b2">Tüm ürünler</span></div></div></div>
<div class="pair"><div><h2>Katkısız harman.</h2><p>Boya yok, aroma yok; yalnızca yaprak.</p></div><div class="shot"></div></div>
</body></html>
