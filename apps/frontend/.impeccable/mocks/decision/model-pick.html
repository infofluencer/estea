<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#1a1a1a;font-family:'Familjen Grotesk',sans-serif}
.nav{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:4px solid #c4161c}
.nav img{height:52px}
.menu{display:flex;gap:30px;font-weight:600;font-size:16px}
.tools{display:flex;gap:20px;font-size:15px}
.hero{position:relative;height:600px;display:grid;grid-template-columns:1fr 1fr}
.band{background:#e2a72e;padding:90px 70px;display:flex;flex-direction:column;justify-content:center}
.band h1{font-size:66px;line-height:1;font-weight:700;letter-spacing:-.02em}
.band p{font-size:19px;margin-top:20px;max-width:440px;line-height:1.5}
.btn{margin-top:30px;align-self:flex-start;background:#c4161c;color:#fff;padding:16px 28px;border-radius:999px;font-weight:700}
.hero img{width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:70px;bottom:30px;display:flex;gap:8px}
.dots i{width:40px;height:6px;background:rgba(0,0,0,.2)}.dots i:first-child{background:#1a1a1a}
.lines{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:28px 48px}
.line{height:160px;border-radius:6px;padding:20px;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:flex-end}
</style></head><body>
<div class="nav"><img src="../../../public/logo.png" alt="Esçay"><div class="menu"><span>Siyah Çay</span><span>Yeşil Çay</span><span>Bitki Çayı</span><span>Harmanlar</span><span>Hediye</span><span>Şeker</span></div><div class="tools"><span>Ara</span><span>Hesabım</span><span>Sepet</span></div></div>
<div class="hero"><div class="band"><h1>Gold Karadeniz</h1><p>Yüksek bahçelerin altın harmanı; 500 g, 1000 g ve 5000 g.</p><span class="btn">Gold serisine git</span></div><img src="../../../public/fabrika/cay-hasadi.jpg" alt=""><div class="dots"><i></i><i></i><i></i><i></i></div></div>
<div class="lines"><div class="line" style="background:#b8862f">Gold</div><div class="line" style="background:#4f8a2b">İlk Hasat</div><div class="line" style="background:#c4161c">Tiryaki</div><div class="line" style="background:#e07a1f">Karadeniz</div></div>
</body></html>
