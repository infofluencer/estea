<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#111827;font-family:Figtree,sans-serif}
.nav{height:80px;display:flex;align-items:center;gap:32px;padding:0 40px;border-bottom:1px solid #e5e7eb}
.nav img{height:44px}
.search{flex:1;height:44px;border:1px solid #d1d5db;border-radius:8px;padding:0 16px;display:flex;align-items:center;color:#9ca3af}
.cats-bar{height:48px;display:flex;gap:28px;align-items:center;padding:0 40px;font-weight:600;font-size:15px;border-bottom:1px solid #e5e7eb}
.hero{height:440px;margin:20px 40px;border-radius:12px;overflow:hidden;position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.hero h1{position:absolute;left:48px;top:120px;color:#fff;font-size:48px;font-weight:700;max-width:520px}
.icons{display:flex;justify-content:space-between;padding:10px 120px}
.ic{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:600}
.ic i{width:96px;height:96px;border-radius:50%;background:#f3f4f6}
</style></head><body>
<div class="nav"><img src="../../../public/logo.png" alt="Esçay"><div class="search">Çay, harman veya ürün ara</div><span>Hesabım</span><span>Sepetim</span></div>
<div class="cats-bar"><span>Siyah Çay</span><span>Yeşil Çay</span><span>Bitki Çayı</span><span>Harmanlar</span><span>Hediye</span><span>Şeker</span></div>
<div class="hero"><img src="../../../public/fabrika/cay-hasadi.jpg" alt=""><h1>Yeni hasat çaylar mağazada</h1></div>
<div class="icons"><div class="ic"><i></i>Siyah Çay</div><div class="ic"><i></i>Yeşil Çay</div><div class="ic"><i></i>Bitki Çayı</div><div class="ic"><i></i>Harmanlar</div><div class="ic"><i></i>Hediye</div><div class="ic"><i></i>Şeker</div></div>
</body></html>
